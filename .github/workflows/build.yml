name: Build

# 建置檢查。不需要任何 secret,所以在 secret 還沒設好之前也能正常運作,
# 適合設成分支保護的必要檢查。
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Astro build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
